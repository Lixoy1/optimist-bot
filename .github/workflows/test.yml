name: Test Optimist Bot

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        env:
          TG_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          DATA_DIR: "/tmp/optimist-test-data"
        run: |
          python -m py_compile optimist_bot_complete_final.py
          test ! -f optimist_entrypoint.py || python -m py_compile optimist_entrypoint.py
          test ! -f optimist_features.py || python -m py_compile optimist_features.py
          test ! -f optimist_hotfixes.py || python -m py_compile optimist_hotfixes.py
          test ! -f optimist_ai_runtime.py || python -m py_compile optimist_ai_runtime.py

      - name: Run unit tests
        env:
          TG_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          DATA_DIR: "/tmp/optimist-test-data"
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "No tests directory on this branch"; fi
