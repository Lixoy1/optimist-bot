name: Deploy Optimist to Railway

on:
  push:
    branches: [main]
    paths:
      - ".railway-ci-trigger"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SECRET_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SECRET_RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      SECRET_RAILWAY_ACCESS_TOKEN: ${{ secrets.RAILWAY_ACCESS_TOKEN }}
      VAR_RAILWAY_TOKEN: ${{ vars.RAILWAY_TOKEN }}
      VAR_RAILWAY_API_TOKEN: ${{ vars.RAILWAY_API_TOKEN }}
      PROJECT_ID: c4b740e5-149f-461d-a5cc-c58cb3881344
      ENVIRONMENT_NAME: production
      SERVICE_NAME: OptimistBot
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Configure Railway authentication
        id: auth
        shell: bash
        run: |
          set -e
          if [ -n "${SECRET_RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN=${SECRET_RAILWAY_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=project-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${SECRET_RAILWAY_PROJECT_TOKEN}" ]; then
            echo "RAILWAY_TOKEN=${SECRET_RAILWAY_PROJECT_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=project-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${VAR_RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN=${VAR_RAILWAY_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=project-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${SECRET_RAILWAY_API_TOKEN}" ]; then
            echo "RAILWAY_API_TOKEN=${SECRET_RAILWAY_API_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=api-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${SECRET_RAILWAY_ACCESS_TOKEN}" ]; then
            echo "RAILWAY_API_TOKEN=${SECRET_RAILWAY_ACCESS_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=api-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${VAR_RAILWAY_API_TOKEN}" ]; then
            echo "RAILWAY_API_TOKEN=${VAR_RAILWAY_API_TOKEN}" >> "$GITHUB_ENV"
            echo "mode=api-token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=browserless" >> "$GITHUB_OUTPUT"
            echo "No Railway token found; starting browserless device login."
            railway login --browserless
          fi

      - name: Link real Railway project
        run: |
          railway link \
            --project "${PROJECT_ID}" \
            --environment "${ENVIRONMENT_NAME}" \
            --service "${SERVICE_NAME}"

      - name: Show target status before deploy
        run: railway status

      - name: Deploy Legacy Brain v3
        id: deploy
        shell: bash
        run: |
          set +e
          railway up \
            --project "${PROJECT_ID}" \
            --environment "${ENVIRONMENT_NAME}" \
            --service "${SERVICE_NAME}" \
            --message "Legacy Brain v3 ${GITHUB_SHA}" \
            --ci \
            > /tmp/railway-deploy.log 2>&1
          RC=$?
          cat /tmp/railway-deploy.log
          if [ ${RC} -eq 0 ]; then
            echo "result=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          exit ${RC}

      - name: Verify deployed service status
        if: success()
        run: |
          railway status
          railway service status --service "${SERVICE_NAME}" --environment "${ENVIRONMENT_NAME}" --project "${PROJECT_ID}"

      - name: Record successful Railway target
        if: success()
        shell: bash
        run: |
          printf 'result=SUCCESS\nproject=%s\nenvironment=%s\nservice=%s\nsource_sha=%s\nutc=%s\n' \
            "${PROJECT_ID}" "${ENVIRONMENT_NAME}" "${SERVICE_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .railway-cli-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .railway-cli-result
          if ! git diff --cached --quiet; then
            git commit -m "Record Railway deploy success"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
