name: Deploy Optimist to Railway

on:
  push:
    branches: [main]
    paths:
      - ".railway-ci-trigger"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SECRET_RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      VAR_RAILWAY_TOKEN: ${{ vars.RAILWAY_TOKEN }}
      PROJECT_ID: c4b740e5-149f-461d-a5cc-c58cb3881344
      ENVIRONMENT_NAME: production
      SERVICE_NAME: OptimistBot
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Railway project token
        id: auth
        shell: bash
        run: |
          set -e
          TOKEN="${SECRET_RAILWAY_TOKEN}"
          [ -n "$TOKEN" ] || TOKEN="${SECRET_RAILWAY_PROJECT_TOKEN}"
          [ -n "$TOKEN" ] || TOKEN="${VAR_RAILWAY_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record missing token
        if: steps.auth.outputs.present != 'true'
        shell: bash
        run: |
          printf 'result=NO_TOKEN\nproject=%s\nenvironment=%s\nservice=%s\nsource_sha=%s\nutc=%s\n' \
            "${PROJECT_ID}" "${ENVIRONMENT_NAME}" "${SERVICE_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .railway-cli-result

      - name: Stop when token is absent
        if: steps.auth.outputs.present != 'true'
        run: echo "RAILWAY_TOKEN is required" && exit 1

      - name: Install Railway CLI
        if: steps.auth.outputs.present == 'true'
        run: npm install --global @railway/cli

      - name: Link real Railway project
        if: steps.auth.outputs.present == 'true'
        run: |
          railway link \
            --project "${PROJECT_ID}" \
            --environment "${ENVIRONMENT_NAME}" \
            --service "${SERVICE_NAME}"

      - name: Show target status before deploy
        if: steps.auth.outputs.present == 'true'
        run: railway status

      - name: Deploy Legacy Brain v3
        if: steps.auth.outputs.present == 'true'
        id: deploy
        shell: bash
        run: |
          railway up \
            --project "${PROJECT_ID}" \
            --environment "${ENVIRONMENT_NAME}" \
            --service "${SERVICE_NAME}" \
            --message "Legacy Brain v3 ${GITHUB_SHA}" \
            --ci

      - name: Verify deployed service status
        if: success() && steps.auth.outputs.present == 'true'
        run: |
          railway status
          railway service status --service "${SERVICE_NAME}" --environment "${ENVIRONMENT_NAME}" --project "${PROJECT_ID}"

      - name: Record successful Railway target
        if: success() && steps.auth.outputs.present == 'true'
        shell: bash
        run: |
          printf 'result=SUCCESS\nproject=%s\nenvironment=%s\nservice=%s\nsource_sha=%s\nutc=%s\n' \
            "${PROJECT_ID}" "${ENVIRONMENT_NAME}" "${SERVICE_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .railway-cli-result

      - name: Publish deploy result marker
        if: always()
        shell: bash
        run: |
          if [ ! -f .railway-cli-result ]; then
            printf 'result=FAILED\nproject=%s\nenvironment=%s\nservice=%s\nsource_sha=%s\nutc=%s\n' \
              "${PROJECT_ID}" "${ENVIRONMENT_NAME}" "${SERVICE_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > .railway-cli-result
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .railway-cli-result
          if ! git diff --cached --quiet; then
            git commit -m "Record Railway deploy result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
